name: lab01

topology:
  nodes:
    firewall:
      kind: linux
      image: wbitt/network-multitool
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 192.168.10.1/24 dev eth1
        - ip addr add 192.168.20.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1

    switch1:
      kind: bridge

    switch2:
      kind: bridge

    atacante:
      kind: linux
      image: wbitt/network-multitool
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route add 192.168.20.0/24 via 192.168.10.1 dev eth1

    cliente:
      kind: linux
      image: wbitt/network-multitool
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip route replace default via 192.168.20.1 dev eth1

    zabbix:
      kind: linux
      image: zabbix/zabbix-appliance:alpine-latest
      ports:
        - "8080:80"
        - "10051:10051"
      exec:
        - ip addr add 192.168.20.5/24 dev eth1
        - ip route replace default via 192.168.20.1 dev eth1

  links:
    # Rede Externa WAN (Switch 1)
    - endpoints: ["atacante:eth1", "switch1:sw1-p1"]
    - endpoints: ["firewall:eth1", "switch1:sw1-p2"]

    # Rede Interna LAN (Switch 2)
    - endpoints: ["firewall:eth2", "switch2:sw2-p1"]
    - endpoints: ["cliente:eth1", "switch2:sw2-p2"]
    - endpoints: ["zabbix:eth1", "switch2:sw2-p3"]
